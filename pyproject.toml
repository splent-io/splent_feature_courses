[build-system]
requires = ["setuptools>=80.3.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "splent_feature_courses"
version = "0.2.0"
readme = "README.md"
requires-python = ">=3.13"

# Page bodies are markdown that was migrated out of an older wiki, so the
# reader has to cope with GitHub-flavoured syntax and with the raw HTML
# already sitting in those bodies. markdown-it-py reads both; nh3 cuts the
# result down to an allowlist, because "written by staff" is not the same
# as "safe to mark as trusted HTML" once the source is an import.
dependencies = [
    "markdown-it-py[linkify]>=3.0",
    "mdit-py-plugins>=0.4",
    "nh3>=0.2",
]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["*.tests", "*.tests.*"]

[tool.splent]
cli_version = "1.15.0"

# ── Feature Contract (auto-generated) ────────────────────────────────────────
# Do not edit manually — re-run `splent feature:contract --write` to refresh.
# Preserved across refreshes: description, category, tags, env,
# requires.features_manual (dependencies invisible to static analysis)
# and provides.routes_manual (routes built from configuration at
# registration time, which have no literal path to find in source).
[tool.splent.contract]
description = "courses feature"
archetype = "full"

[tool.splent.contract.provides]
routes     = ["/", "/<COURSES_PATH>", "/<COURSES_PATH>/<course_slug>", "/<COURSES_PATH>/<course_slug>/<COURSES_CATEGORY_SEGMENT>/<category_slug>", "/<COURSES_PATH>/<course_slug>/<COURSES_PAGE_SEGMENT>/<page_slug>", "/<COURSES_PATH>/search", "/admin/courses", "/admin/courses/<int:course_id>/categories/new", "/admin/courses/<int:course_id>/copy", "/admin/courses/<int:course_id>/delete", "/admin/courses/<int:course_id>/edit", "/admin/courses/<int:course_id>/pages/new", "/admin/courses/attachments/<int:attachment_id>/detach", "/admin/courses/categories/<int:category_id>/delete", "/admin/courses/categories/<int:category_id>/edit", "/admin/courses/new", "/admin/courses/pages/<int:page_id>/attach", "/admin/courses/pages/<int:page_id>/delete", "/admin/courses/pages/<int:page_id>/edit"]
routes_manual = ["/", "/<COURSES_PATH>", "/<COURSES_PATH>/<course_slug>", "/<COURSES_PATH>/<course_slug>/<COURSES_CATEGORY_SEGMENT>/<category_slug>", "/<COURSES_PATH>/<course_slug>/<COURSES_PAGE_SEGMENT>/<page_slug>", "/<COURSES_PATH>/search"]
blueprints = []
models     = ["Category", "Course", "Page", "PageAttachment"]
commands   = ["copy-course", "hide", "import-bookstack", "new-course", "publish", "status", "verify-bookstack"]
hooks      = ["layout.authenticated_sidebar", "layout.head.css", "layout.scripts"]
services   = ["CoursesService"]
signals    = []
translations = []
docker     = []

[tool.splent.contract.requires]
features = ["auth", "media"]
env_vars = ["COURSES_CATEGORY_SEGMENT", "COURSES_DEFAULT_CATEGORIES", "COURSES_DESCRIPTION_TEMPLATE", "COURSES_NAME_PREFIX", "COURSES_PAGE_SEGMENT", "COURSES_PATH", "COURSES_TIMEZONE"]
signals  = []

[tool.splent.contract.extensible]
services  = ["CoursesService"]
templates = ["courses/admin/category_form.html", "courses/admin/course_form.html", "courses/admin/courses.html", "courses/admin/page_form.html", "courses/category.html", "courses/course.html", "courses/hooks/admin_sidebar.html", "courses/index.html", "courses/page.html", "courses/search.html"]
models    = ["Category", "Course", "Page", "PageAttachment"]
hooks     = ["layout.authenticated_sidebar", "layout.head.css", "layout.scripts"]
routes    = false
