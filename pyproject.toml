[build-system]
requires = ["setuptools>=80.3.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "splent_feature_courses"
version = "0.8.1"
readme = "README.md"
requires-python = ">=3.13"

# Page bodies are markdown that was migrated out of an older wiki, so the
# reader has to cope with GitHub-flavoured syntax and with the raw HTML
# already sitting in those bodies. markdown-it-py reads both; nh3 cuts the
# result down to an allowlist, because "written by staff" is not the same
# as "safe to mark as trusted HTML" once the source is an import.
dependencies = [
    "splent_framework>=1.9.0",
    "markdown-it-py[linkify]>=3.0",
    "mdit-py-plugins>=0.4",
    "nh3>=0.2",
    # Reading a BookStack whose authors used the visual editor, which is the
    # one it ships as the default. Those pages have no markdown at all.
    "markdownify>=0.13",
]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["*.tests", "*.tests.*"]

[tool.splent]
cli_version = "1.15.0"

# ── Feature Contract (auto-generated) ────────────────────────────────────────
# Do not edit manually — re-run `splent feature:contract --write` to refresh.
# Preserved across refreshes: description, category, tags, env,
# requires.features_manual (dependencies invisible to static analysis)
# and provides.routes_manual (routes built from configuration at
# registration time, which have no literal path to find in source).
[tool.splent.contract]
description = "courses feature"
archetype = "full"

[tool.splent.contract.provides]
routes     = ["/", "/<COURSES_PATH>", "/<COURSES_PATH>/<course_slug>", "/<COURSES_PATH>/<course_slug>/<COURSES_CATEGORY_SEGMENT>/<category_slug>", "/<COURSES_PATH>/<course_slug>/<COURSES_PAGE_SEGMENT>/<page_slug>", "/<COURSES_PATH>/search", "/admin/courses", "/admin/courses/<int:course_id>/categories/new", "/admin/courses/<int:course_id>/copy", "/admin/courses/<int:course_id>/delete", "/admin/courses/<int:course_id>/edit", "/admin/courses/<int:course_id>/pages/new", "/admin/courses/activity", "/admin/courses/attachments/<int:attachment_id>/detach", "/admin/courses/categories/<int:category_id>/delete", "/admin/courses/categories/<int:category_id>/edit", "/admin/courses/files", "/admin/courses/new", "/admin/courses/pages", "/admin/courses/pages/<int:page_id>/attach", "/admin/courses/pages/<int:page_id>/delete", "/admin/courses/pages/<int:page_id>/edit", "/admin/courses/pages/<int:page_id>/history", "/admin/courses/pages/<int:page_id>/history/<int:revision_id>", "/admin/courses/pages/<int:page_id>/history/<int:revision_id>/restore", "/admin/courses/preview"]
routes_manual = ["/", "/<COURSES_PATH>", "/<COURSES_PATH>/<course_slug>", "/<COURSES_PATH>/<course_slug>/<COURSES_CATEGORY_SEGMENT>/<category_slug>", "/<COURSES_PATH>/<course_slug>/<COURSES_PAGE_SEGMENT>/<page_slug>", "/<COURSES_PATH>/search"]
blueprints = []
models     = ["Category", "Course", "Page", "PageAttachment", "PageRevision"]
commands   = ["copy-course", "hide", "import-bookstack", "new-course", "publish", "repair-links", "status", "verify-bookstack"]
hooks      = ["layout.authenticated_sidebar", "layout.head.css", "layout.scripts"]
services   = ["CoursesService"]
signals    = []
translations = ["es"]
docker     = []

[tool.splent.contract.requires]
features = ["auth", "media"]
features_optional = ["settings"]
env_vars = ["COURSES_CATEGORY_SEGMENT", "COURSES_DEFAULT_CATEGORIES", "COURSES_DESCRIPTION_TEMPLATE", "COURSES_NAME_PREFIX", "COURSES_PAGE_SEGMENT", "COURSES_PATH", "COURSES_TIMEZONE"]
signals  = []

[tool.splent.contract.extensible]
services  = ["CoursesService"]
templates = ["courses/admin/activity.html", "courses/admin/category_form.html", "courses/admin/course_form.html", "courses/admin/courses.html", "courses/admin/files.html", "courses/admin/page_form.html", "courses/admin/page_history.html", "courses/admin/page_revision.html", "courses/admin/pages.html", "courses/category.html", "courses/course.html", "courses/hooks/admin_sidebar.html", "courses/index.html", "courses/page.html"]
models    = ["Category", "Course", "Page", "PageAttachment", "PageRevision"]
hooks     = ["layout.authenticated_sidebar", "layout.head.css", "layout.scripts"]
routes    = false

# ── Configuration ─────────────────────────────────────────────────────────
# What this feature reads from the environment, and what it falls back to.
# A product overrides any of these in its own [tool.splent.config]; it does
# not copy them.
[tool.splent.config]
# The words the material is served under. Spanish by default because that
# is what the products of this line are taught in, and a URL is read by
# students far more often than it is typed by staff.
COURSES_PATH = "cursos"
COURSES_CATEGORY_SEGMENT = "categoria"
COURSES_PAGE_SEGMENT = "pagina"
# How a new academic year is named and described. Empty here because only
# a product knows what its subject is called.
COURSES_NAME_PREFIX = ""
COURSES_DESCRIPTION_TEMPLATE = ""
COURSES_DEFAULT_CATEGORIES = ""
# The zone staff type release dates in. Getting this wrong publishes
# material an hour early twice a year.
COURSES_TIMEZONE = "Europe/Madrid"
